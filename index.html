<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>G&LStudio — Workflow Foto & Video</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, sans-serif; }
  body {
    background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
    min-height: 100vh; padding: 20px; color: #333;
  }
  .container { max-width: 1400px; margin: 0 auto; }
  .login-box {
    max-width: 420px; margin: 80px auto; background: rgba(255,255,255,0.97);
    border-radius: 20px; padding: 40px; box-shadow: 0 15px 50px rgba(0,0,0,0.3);
    text-align: center;
  }
  .login-box h1 {
    background: linear-gradient(45deg, #667eea, #f093fb);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    font-size: 2.2em; margin-bottom: 5px;
  }
  .login-box p { color: #888; margin-bottom: 25px; }
  .login-box input {
    width: 100%; padding: 12px 15px; margin: 8px 0; border: 2px solid #e0e0e0;
    border-radius: 10px; font-size: 1em; transition: border 0.3s;
  }
  .login-box input:focus { outline: none; border-color: #764ba2; }
  .login-box button {
    width: 100%; padding: 12px; margin-top: 15px; border: none; border-radius: 10px;
    background: linear-gradient(45deg, #667eea, #f093fb); color: white;
    font-size: 1.1em; font-weight: 600; cursor: pointer; transition: transform 0.2s;
  }
  .login-box button:hover { transform: translateY(-2px); }
  .login-error { color: #e74c3c; margin-top: 10px; font-size: 0.9em; min-height: 20px; }
  .app { display: none; }
  .app.active { display: block; }
  header {
    background: rgba(255,255,255,0.95); border-radius: 20px; padding: 25px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.2); margin-bottom: 25px;
    display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 15px;
  }
  .logo {
    font-size: 2em; font-weight: bold;
    background: linear-gradient(45deg, #667eea, #f093fb);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  }
  .logo span { font-size: 0.5em; display: block; color: #888; -webkit-text-fill-color: #888; }
  .actions button {
    margin-left: 8px; padding: 10px 18px; border: none; border-radius: 10px;
    cursor: pointer; font-weight: 600; transition: transform 0.2s;
  }
  .actions button:hover { transform: translateY(-2px); }
  .btn-new { background: linear-gradient(45deg, #f093fb, #f5576c); color: white; }
  .btn-archive { background: linear-gradient(45deg, #667eea, #764ba2); color: white; }
  .btn-table { background: linear-gradient(45deg, #ff9a9e, #fad0c4); color: white; }
  .btn-backup { background: linear-gradient(45deg, #4facfe, #00f2fe); color: white; }
  .btn-restore { background: linear-gradient(45deg, #43e97b, #38f9d7); color: white; }
  .btn-logout { background: linear-gradient(45deg, #fa709a, #fee140); color: white; }
  .new-service {
    background: white; border-radius: 18px; padding: 25px; margin-bottom: 20px;
    box-shadow: 0 8px 25px rgba(0,0,0,0.15); display: none;
  }
  .new-service.open { display: block; }
  .new-service h2 { color: #4a3f8c; margin-bottom: 15px; }
  .form-row { display: flex; gap: 15px; flex-wrap: wrap; margin-bottom: 12px; }
  .form-row input, .form-row select {
    flex: 1; min-width: 200px; padding: 10px; border: 2px solid #e0e0e0;
    border-radius: 10px; font-size: 1em;
  }
  .form-row input:focus, .form-row select:focus { outline: none; border-color: #764ba2; }
  .form-actions { display: flex; gap: 10px; justify-content: flex-end; }
  .form-actions button {
    padding: 10px 20px; border: none; border-radius: 10px; cursor: pointer; font-weight: 600;
  }
  .btn-save { background: linear-gradient(45deg, #43e97b, #38f9d7); color: white; }
  .btn-cancel { background: #eee; color: #555; }
  .card {
    background: white; border-radius: 18px; padding: 20px; margin-bottom: 18px;
    box-shadow: 0 8px 25px rgba(0,0,0,0.15); transition: transform 0.2s;
  }
  .card:hover { transform: translateY(-3px); }
  .card-header {
    display: flex; justify-content: space-between; align-items: center;
    cursor: pointer; flex-wrap: wrap; gap: 10px;
  }
  .client-info { flex: 1; min-width: 200px; }
  .client-name { font-size: 1.3em; font-weight: 700; color: #4a3f8c; }
  .client-date { font-size: 0.85em; color: #888; margin-top: 3px; }
  .videographer-info { font-size: 0.85em; color: #764ba2; margin-top: 3px; font-weight: 500; }
  .service-badge {
    padding: 6px 14px; border-radius: 20px; font-size: 0.85em;
    color: white; font-weight: 600; text-transform: uppercase;
  }
  .progress-bar {
    background: #eee; height: 10px; border-radius: 5px; margin-top: 12px; overflow: hidden;
  }
  .progress-fill {
    height: 100%; background: linear-gradient(90deg, #43e97b, #38f9d7);
    transition: width 0.4s;
  }
  .progress-text { font-size: 0.85em; color: #666; margin-top: 5px; }
  .progress-row { display: flex; gap: 15px; flex-wrap: wrap; margin-top: 8px; }
  .progress-row > div { flex: 1; min-width: 200px; }
  .progress-label { font-size: 0.75em; color: #888; margin-bottom: 3px; font-weight: 600; }
  .steps { margin-top: 18px; display: none; padding-top: 15px; }
  .steps.open { display: block; }
  .section-title {
    font-size: 1.1em; font-weight: 700; padding: 10px 15px; margin: 10px 0;
    border-radius: 10px; color: white;
  }
  .section-title.preview { background: linear-gradient(45deg, #ffd700, #ffb347); }
  .section-title.service { background: linear-gradient(45deg, #667eea, #764ba2); }
  .step {
    display: flex; align-items: center; padding: 10px; margin: 6px 0;
    background: #f8f9ff; border-radius: 10px; gap: 12px; flex-wrap: wrap;
  }
  .step.done { background: linear-gradient(90deg, #e0ffe0, #f0fff0); }
  .step input[type=checkbox] {
    width: 22px; height: 22px; cursor: pointer; accent-color: #43e97b; flex-shrink: 0;
  }
  .step-label { flex: 1; font-weight: 500; min-width: 200px; }
  .step input[type=date] {
    padding: 5px 8px; border: 1px solid #ccc; border-radius: 6px; font-size: 0.9em;
  }
  .step input[type=text] {
    padding: 5px 8px; border: 1px solid #ccc; border-radius: 6px; font-size: 0.9em; width: 180px;
  }
  .step select {
    padding: 5px 8px; border: 1px solid #ccc; border-radius: 6px; font-size: 0.9em;
    background: white; cursor: pointer;
  }
  .step.done .step-label { text-decoration: line-through; color: #888; }
  .step-extra { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 6px; width: 100%; padding-left: 34px; }
  .step-extra input, .step-extra select { flex: 1; min-width: 150px; }
  .card-footer {
    margin-top: 15px; display: flex; justify-content: flex-end; gap: 10px;
    padding-top: 15px; border-top: 1px dashed #ddd; flex-wrap: wrap;
  }
  .btn-view { background: linear-gradient(45deg, #667eea, #764ba2); color: white; padding: 8px 16px; border: none; border-radius: 8px; cursor: pointer; font-weight: 600; }
  .btn-edit { background: linear-gradient(45deg, #f093fb, #f5576c); color: white; padding: 8px 16px; border: none; border-radius: 8px; cursor: pointer; font-weight: 600; }
  .btn-pdf { background: linear-gradient(45deg, #4facfe, #00f2fe); color: white; padding: 8px 16px; border: none; border-radius: 8px; cursor: pointer; font-weight: 600; }
  .btn-del { background: linear-gradient(45deg, #fa709a, #fee140); color: white; padding: 8px 16px; border: none; border-radius: 8px; cursor: pointer; font-weight: 600; }
  .empty {
    text-align: center; padding: 60px 20px; color: white; font-size: 1.2em;
    background: rgba(255,255,255,0.15); border-radius: 20px;
  }
  .modal {
    display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0,0,0,0.6); z-index: 1000; justify-content: center; align-items: center;
    padding: 20px;
  }
  .modal.active { display: flex; }
  .modal-content {
    background: white; border-radius: 20px; max-width: 800px; width: 100%;
    max-height: 90vh; overflow-y: auto; box-shadow: 0 20px 60px rgba(0,0,0,0.3);
  }
  .modal-header {
    background: linear-gradient(45deg, #667eea, #f093fb); color: white;
    padding: 25px; border-radius: 20px 20px 0 0; display: flex; justify-content: space-between; align-items: center;
  }
  .modal-header h2 { font-size: 1.5em; }
  .modal-close {
    background: rgba(255,255,255,0.2); border: none; color: white;
    width: 35px; height: 35px; border-radius: 50%; cursor: pointer; font-size: 1.2em;
  }
  .modal-body { padding: 25px; }
  .detail-row { margin-bottom: 15px; padding: 12px; background: #f8f9ff; border-radius: 10px; }
  .detail-label { font-weight: 600; color: #4a3f8c; margin-bottom: 5px; font-size: 0.9em; }
  .detail-value { color: #333; font-size: 1em; }
  .step-detail {
    padding: 10px; margin: 6px 0; background: white; border-radius: 8px;
    border-left: 4px solid #ddd;
  }
  .step-detail.completed { border-left-color: #43e97b; background: #f0fff0; }
  .step-detail .step-name { font-weight: 600; margin-bottom: 5px; }
  .step-detail .step-date { color: #667eea; font-size: 0.9em; }
  .step-detail .step-extra-info { color: #888; font-size: 0.85em; margin-top: 3px; }
  .archive-header {
    background: white; border-radius: 18px; padding: 20px; margin-bottom: 20px;
    box-shadow: 0 8px 25px rgba(0,0,0,0.15); display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 15px;
  }
  .search-box {
    flex: 1; min-width: 200px; padding: 10px 15px; border: 2px solid #e0e0e0;
    border-radius: 10px; font-size: 1em;
  }
  .filter-select {
    padding: 10px 15px; border: 2px solid #e0e0e0; border-radius: 10px; font-size: 1em;
  }
  .table-container {
    background: white; border-radius: 18px; padding: 20px; margin-bottom: 20px;
    box-shadow: 0 8px 25px rgba(0,0,0,0.15); overflow-x: auto;
  }
  .table-header {
    display: flex; justify-content: space-between; align-items: center;
    flex-wrap: wrap; gap: 15px; margin-bottom: 15px;
  }
  .table-header h2 { color: #4a3f8c; }
  .table-toolbar { display: flex; gap: 10px; flex-wrap: wrap; }
  .workflow-table {
    width: 100%; border-collapse: collapse; font-size: 0.85em;
    min-width: 1700px;
  }
  .workflow-table thead {
    background: linear-gradient(45deg, #667eea, #764ba2);
    color: white; position: sticky; top: 0;
  }
  .workflow-table th {
    padding: 12px 8px; text-align: center; font-weight: 600;
    border: 1px solid rgba(255,255,255,0.3); font-size: 0.8em;
    white-space: nowrap;
  }
  .workflow-table th:first-child, .workflow-table th:nth-child(2), .workflow-table th:nth-child(3), .workflow-table th:nth-child(4) {
    position: sticky; left: 0; background: linear-gradient(45deg, #667eea, #764ba2); z-index: 2;
  }
  .workflow-table th:nth-child(2) { left: 150px; }
  .workflow-table th:nth-child(3) { left: 280px; }
  .workflow-table th:nth-child(4) { left: 380px; }
  .workflow-table td {
    padding: 8px; border: 1px solid #e0e0e0; text-align: center;
    vertical-align: middle;
  }
  .workflow-table td:first-child {
    position: sticky; left: 0; background: #f8f9ff; font-weight: 600;
    color: #4a3f8c; z-index: 1; min-width: 150px; text-align: left;
  }
  .workflow-table td:nth-child(2) {
    position: sticky; left: 150px; background: #f8f9ff; z-index: 1; min-width: 130px;
  }
  .workflow-table td:nth-child(3) {
    position: sticky; left: 280px; background: #f8f9ff; z-index: 1; min-width: 100px;
  }
  .workflow-table td:nth-child(4) {
    position: sticky; left: 380px; background: #f8f9ff; z-index: 1; min-width: 130px;
  }
  .workflow-table tbody tr:nth-child(even) { background: #fafbff; }
  .workflow-table tbody tr:hover { background: #f0f4ff; }
  .workflow-table tbody tr:hover td:first-child,
  .workflow-table tbody tr:hover td:nth-child(2),
  .workflow-table tbody tr:hover td:nth-child(3),
  .workflow-table tbody tr:hover td:nth-child(4) { background: #e8ecff; }
  .cell-step {
    display: flex; flex-direction: column; align-items: center; gap: 4px;
  }
  .cell-step input[type=checkbox] {
    width: 18px; height: 18px; accent-color: #43e97b; cursor: pointer;
  }
  .cell-step input[type=date] {
    font-size: 0.75em; padding: 2px 4px; border: 1px solid #ccc; border-radius: 4px; width: 90px;
  }
  .cell-step input[type=text] {
    font-size: 0.75em; padding: 2px 4px; border: 1px solid #ccc; border-radius: 4px; width: 110px;
  }
  .cell-step select {
    font-size: 0.75em; padding: 2px 4px; border: 1px solid #ccc; border-radius: 4px; width: 110px;
    background: white;
  }
  .cell-done { background: linear-gradient(90deg, #e0ffe0, #f0fff0) !important; }
  .cell-actions {
    display: flex; gap: 5px; justify-content: center; flex-wrap: wrap;
  }
  .cell-actions button {
    padding: 4px 8px; border: none; border-radius: 5px; cursor: pointer;
    font-size: 0.8em; font-weight: 600;
  }
  .mini-view { background: #667eea; color: white; }
  .mini-edit { background: #f093fb; color: white; }
  .mini-pdf { background: #4facfe; color: white; }
  .mini-del { background: #fa709a; color: white; }
  .badge-cell {
    display: inline-block; padding: 3px 10px; border-radius: 12px;
    color: white; font-size: 0.8em; font-weight: 600;
  }
  .summary-badge {
    display: inline-block; padding: 4px 10px; border-radius: 12px;
    font-size: 0.8em; font-weight: 600; color: white;
  }
  @media (max-width: 600px) {
    .logo { font-size: 1.5em; }
    .actions button { margin: 4px; padding: 8px 12px; font-size: 0.9em; }
    .modal-content { margin: 10px; }
  }
</style>
</head>
<body>

<div id="loginScreen" class="login-box">
  <h1> G&LStudio</h1>
  <p>Foto & Video — Workflow Manager</p>
  <input type="text" id="loginUser" placeholder="Utente" autocomplete="username">
  <input type="password" id="loginPass" placeholder="Password" autocomplete="current-password">
  <button onclick="doLogin()">Accedi</button>
  <div class="login-error" id="loginError"></div>
</div>

<div id="app" class="app">
  <div class="container">
    <header>
      <div class="logo"> G&LStudio<span>Workflow Foto & Video</span></div>
      <div class="actions">
        <button class="btn-new" onclick="toggleNewService()">➕ Nuovo Servizio</button>
        <button class="btn-archive" onclick="showArchive()">📁 Archivio</button>
        <button class="btn-table" onclick="showTable()"> Tabella Clienti</button>
        <button class="btn-backup" onclick="doBackup()">💾 Backup</button>
        <button class="btn-restore" onclick="document.getElementById('restoreFile').click()">📥 Ripristina</button>
        <button class="btn-logout" onclick="doLogout()">🚪 Esci</button>
      </div>
    </header>

    <div id="newService" class="new-service">
      <h2>✨ Nuovo Servizio</h2>
      <div class="form-row">
        <input type="text" id="inputClient" placeholder="Nome cliente (es. Rossi - Bianchi)">
        <select id="inputType">
          <option value="">-- Tipo di servizio --</option>
          <option value="Anteprima + Matrimonio">🎬💒 Anteprima + Matrimonio</option>
          <option value="Matrimonio">💒 Matrimonio</option>
          <option value="Battesimo">👶 Battesimo</option>
          <option value="New Born">🍼 New Born</option>
          <option value="1° Compleanno">🎈 1° Compleanno</option>
          <option value="18° Compleanno"> 18° Compleanno</option>
          <option value="Compleanno">🎂 Compleanno</option>
          <option value="Anniversario">💍 Anniversario</option>
          <option value="Comunione">⛪ Comunione</option>
          <option value="Cresima">✝️ Cresima</option>
          <option value="Evento">🎊 Evento</option>
        </select>
      </div>
      <div class="form-row">
        <input type="date" id="inputDate">
        <input type="text" id="inputVideographer" placeholder="🎥 Videografo/Collega (nome)">
      </div>
      <div class="form-actions">
        <button class="btn-cancel" onclick="toggleNewService()">Annulla</button>
        <button class="btn-save" onclick="saveService()">💾 Salva</button>
      </div>
    </div>

    <div id="archiveView" style="display:none;">
      <div class="archive-header">
        <h2>📁 Archivio Servizi</h2>
        <div style="display:flex; gap:10px; flex-wrap:wrap;">
          <input type="text" class="search-box" id="searchBox" placeholder="🔍 Cerca cliente..." oninput="filterServices()">
          <select class="filter-select" id="filterType" onchange="filterServices()">
            <option value="">Tutti i tipi</option>
            <option value="Anteprima + Matrimonio">Anteprima + Matrimonio</option>
            <option value="Matrimonio">Matrimonio</option>
            <option value="Battesimo">Battesimo</option>
            <option value="New Born">New Born</option>
            <option value="1° Compleanno">1° Compleanno</option>
            <option value="18° Compleanno">18° Compleanno</option>
            <option value="Compleanno">Compleanno</option>
            <option value="Anniversario">Anniversario</option>
            <option value="Comunione">Comunione</option>
            <option value="Cresima">Cresima</option>
            <option value="Evento">Evento</option>
          </select>
          <button class="btn-cancel" onclick="showMain()">← Torna alla Home</button>
        </div>
      </div>
      <div id="archiveList"></div>
    </div>

    <div id="tableView" style="display:none;">
      <div class="table-container">
        <div class="table-header">
          <h2>📊 Tabella Clienti — Workflow Completo</h2>
          <div class="table-toolbar">
            <input type="text" class="search-box" id="tableSearch" placeholder=" Cerca..." oninput="renderTable()" style="min-width:200px;">
            <button class="btn-pdf" onclick="generateTablePDF()"> PDF Tabella</button>
            <button class="btn-cancel" onclick="showMain()">← Torna alla Home</button>
          </div>
        </div>
        <div style="overflow-x:auto;">
          <table class="workflow-table" id="workflowTable"></table>
        </div>
      </div>
    </div>

    <div id="servicesList"></div>
  </div>
</div>

<div id="detailModal" class="modal">
  <div class="modal-content">
    <div class="modal-header">
      <h2 id="detailTitle">📋 Dettagli Servizio</h2>
      <button class="modal-close" onclick="closeModal('detailModal')">&times;</button>
    </div>
    <div class="modal-body" id="detailBody"></div>
  </div>
</div>

<div id="editModal" class="modal">
  <div class="modal-content">
    <div class="modal-header">
      <h2>✏️ Modifica Servizio</h2>
      <button class="modal-close" onclick="closeModal('editModal')">&times;</button>
    </div>
    <div class="modal-body">
      <div class="form-row">
        <input type="text" id="editClient" placeholder="Nome cliente">
        <select id="editType">
          <option value="Anteprima + Matrimonio">Anteprima + Matrimonio</option>
          <option value="Matrimonio">Matrimonio</option>
          <option value="Battesimo">Battesimo</option>
          <option value="New Born">New Born</option>
          <option value="1° Compleanno">1° Compleanno</option>
          <option value="18° Compleanno">18° Compleanno</option>
          <option value="Compleanno">Compleanno</option>
          <option value="Anniversario">Anniversario</option>
          <option value="Comunione">Comunione</option>
          <option value="Cresima">Cresima</option>
          <option value="Evento">Evento</option>
        </select>
      </div>
      <div class="form-row">
        <input type="date" id="editDate">
        <input type="text" id="editVideographer" placeholder="🎥 Videografo/Collega">
      </div>
      <div class="form-actions">
        <button class="btn-cancel" onclick="closeModal('editModal')">Annulla</button>
        <button class="btn-save" onclick="saveEdit()">💾 Salva Modifiche</button>
      </div>
    </div>
  </div>
</div>

<script>
const USER = "G&LStudio";
const PASS = "12763Mlg";

// STEP DEL SERVIZIO (completo)
const STEPS = [
  { id: "download",    label: "📥 Download schede", short: "📥" },
  { id: "backupAB",    label: "💾 Archiviazione HD A/B", short: "💾" },
  { id: "archiveVideo",label: "🎬 Archiviazione Video", short: "🎬", extra: true, extraType: "archivedBy" },
  { id: "backupAltro", label: "💿 Archiviazione su altro", short: "💿", extra: true, extraLabel: "Dove (cloud, NAS, altro HD...)" },
  { id: "rawToJpg",    label: "🔄 RAW → JPEG", short: "🔄" },
  { id: "selection",   label: "👀 Selezione + Copertina", short: "", extra: true, extraType: "cover" },
  { id: "albumEdit",   label: "🎨 Lavorazione album", short: "🎨" },
  { id: "sendLab",     label: "📤 Invio laboratorio", short: "📤" },
  { id: "labToStudio", label: " Lab → Studio", short: "📦" },
  { id: "albumClient", label: "🎁 Album al cliente", short: "" },
  { id: "filesClient", label: "📁 File e video al cliente", short: "📁" },
  { id: "confirmDel",  label: "✅ Conferma cancellazione", short: "✅" }
];

// STEP DELL'ANTEPRIMA (ridotti)
const STEPS_PREVIEW = [
  { id: "p_download",    label: "📥 Download schede", short: "P" },
  { id: "p_backupAB",    label: "💾 Archiviazione HD A/B", short: "💾P" },
  { id: "p_archiveVideo",label: "🎬 Archiviazione Video", short: "🎬P", extra: true, extraType: "archivedBy" },
  { id: "p_backupAltro", label: "💿 Archiviazione su altro", short: "💿P", extra: true, extraLabel: "Dove (cloud, NAS, altro HD...)" },
  { id: "p_rawToJpg",    label: "🔄 RAW → JPEG", short: "🔄P" },
  { id: "p_deliverPreview", label: "📤 Consegna Anteprima al cliente", short: "📤P" }
];

const TYPE_COLORS = {
  "Anteprima + Matrimonio": "#ff8c42",
  "Matrimonio":     "#f5576c",
  "Battesimo":      "#4facfe",
  "New Born":       "#a1c4fd",
  "1° Compleanno":  "#ffd700",
  "18° Compleanno": "#fa709a",
  "Compleanno":     "#ff9a9e",
  "Anniversario":   "#a18cd1",
  "Comunione":      "#84fab0",
  "Cresima":        "#fccb90",
  "Evento":         "#667eea"
};

let services = JSON.parse(localStorage.getItem("gl_services") || "[]");
let editingId = null;

// ===== MIGRAZIONE =====
function migrateService(s) {
  // Inizializza step servizio se mancano
  STEPS.forEach(st => {
    if (!s.steps) s.steps = {};
    if (!s.steps[st.id]) s.steps[st.id] = { done: false, date: "", extra: {} };
    if (!s.steps[st.id].extra) s.steps[st.id].extra = {};
  });
  // Inizializza step anteprima se il tipo è "Anteprima + Matrimonio"
  if (s.type === "Anteprima + Matrimonio") {
    if (!s.previewSteps) s.previewSteps = {};
    STEPS_PREVIEW.forEach(st => {
      if (!s.previewSteps[st.id]) s.previewSteps[st.id] = { done: false, date: "", extra: {} };
      if (!s.previewSteps[st.id].extra) s.previewSteps[st.id].extra = {};
    });
  }
  if (s.videographer === undefined) s.videographer = "";
  return s;
}
services = services.map(migrateService);

function isPreviewType(type) {
  return type === "Anteprima + Matrimonio";
}

function doLogin() {
  const u = document.getElementById("loginUser").value.trim();
  const p = document.getElementById("loginPass").value;
  const err = document.getElementById("loginError");
  if (u === USER && p === PASS) {
    sessionStorage.setItem("gl_auth", "1");
    showApp();
  } else {
    err.textContent = "❌ Credenziali non valide";
  }
}
function doLogout() {
  sessionStorage.removeItem("gl_auth");
  location.reload();
}
function showApp() {
  document.getElementById("loginScreen").style.display = "none";
  document.getElementById("app").classList.add("active");
  renderServices();
}
if (sessionStorage.getItem("gl_auth") === "1") showApp();

function toggleNewService() {
  document.getElementById("newService").classList.toggle("open");
}
function saveService() {
  const client = document.getElementById("inputClient").value.trim();
  const type = document.getElementById("inputType").value;
  const date = document.getElementById("inputDate").value;
  const videographer = document.getElementById("inputVideographer").value.trim();
  if (!client || !type) { alert("Inserisci nome cliente e tipo di servizio"); return; }
  
  const steps = {};
  STEPS.forEach(s => steps[s.id] = { done: false, date: "", extra: {} });
  
  const newService = {
    id: Date.now(),
    client, type, date, videographer,
    steps,
    createdAt: new Date().toISOString()
  };
  
  // Se è Anteprima + Matrimonio, aggiungi anche previewSteps
  if (isPreviewType(type)) {
    newService.previewSteps = {};
    STEPS_PREVIEW.forEach(s => newService.previewSteps[s.id] = { done: false, date: "", extra: {} });
  }
  
  services.unshift(newService);
  save();
  document.getElementById("inputClient").value = "";
  document.getElementById("inputType").value = "";
  document.getElementById("inputDate").value = "";
  document.getElementById("inputVideographer").value = "";
  toggleNewService();
  renderServices();
}

function getArchiveByOptions(s) {
  const options = [`<option value="G&LStudio">G&LStudio</option>`];
  if (s.videographer && s.videographer.trim()) {
    options.push(`<option value="${s.videographer}">${s.videographer} (collega)</option>`);
  }
  options.push(`<option value="__altro__">✏️ Altro (scrivi nome)...</option>`);
  return options.join("");
}

function countDone(stepsObj, stepsList) {
  return stepsList.filter(st => stepsObj[st.id]?.done).length;
}

function renderServices(data = services) {
  const list = document.getElementById("servicesList");
  if (data.length === 0) {
    list.innerHTML = '<div class="empty">📭 Nessun servizio. Clicca su " Nuovo Servizio" per iniziare!</div>';
    return;
  }
  list.innerHTML = data.map(s => {
    const serviceDone = countDone(s.steps, STEPS);
    const servicePct = Math.round((serviceDone / STEPS.length) * 100);
    const color = TYPE_COLORS[s.type] || TYPE_COLORS["Evento"];
    const videoInfo = s.videographer ? `<div class="videographer-info">🎥 Videografo: ${s.videographer}</div>` : '';
    
    let progressHtml = '';
    if (isPreviewType(s.type)) {
      const previewDone = countDone(s.previewSteps || {}, STEPS_PREVIEW);
      const previewPct = Math.round((previewDone / STEPS_PREVIEW.length) * 100);
      progressHtml = `
        <div class="progress-row">
          <div>
            <div class="progress-label">🎬 ANTEPRIMA</div>
            <div class="progress-bar"><div class="progress-fill" style="width:${previewPct}%; background: linear-gradient(90deg, #ffd700, #ffb347);"></div></div>
            <div class="progress-text">${previewDone}/${STEPS_PREVIEW.length} (${previewPct}%)</div>
          </div>
          <div>
            <div class="progress-label">💒 SERVIZIO</div>
            <div class="progress-bar"><div class="progress-fill" style="width:${servicePct}%"></div></div>
            <div class="progress-text">${serviceDone}/${STEPS.length} (${servicePct}%)</div>
          </div>
        </div>`;
    } else {
      progressHtml = `<div class="progress-bar"><div class="progress-fill" style="width:${servicePct}%"></div></div>
        <div class="progress-text">Avanzamento: ${serviceDone}/${STEPS.length} (${servicePct}%)</div>`;
    }
    
    return `
      <div class="card">
        <div class="card-header" onclick="toggleSteps(${s.id})">
          <div class="client-info">
            <div class="client-name">${s.client}</div>
            <div class="client-date">${s.date ? '📅 ' + s.date : ''}</div>
            ${videoInfo}
          </div>
          <div class="service-badge" style="background:${color}">${s.type}</div>
        </div>
        ${progressHtml}
        <div class="steps" id="steps-${s.id}">${renderSteps(s)}</div>
        <div class="card-footer">
          <button class="btn-view" onclick="viewService(${s.id})">️ Visualizza</button>
          <button class="btn-edit" onclick="editService(${s.id})">✏️ Modifica</button>
          <button class="btn-pdf" onclick="generatePDF(${s.id})">📄 PDF</button>
          <button class="btn-del" onclick="deleteService(${s.id})">🗑️ Elimina</button>
        </div>
      </div>`;
  }).join("");
}

function renderSteps(s) {
  let html = '';
  
  // Sezione ANTEPRIMA (solo per Anteprima + Matrimonio)
  if (isPreviewType(s.type)) {
    html += `<div class="section-title preview">🎬 ANTEPRIMA</div>`;
    html += STEPS_PREVIEW.map(st => renderStepRow(s, st, 'preview')).join('');
  }
  
  // Sezione SERVIZIO
  const serviceTitle = isPreviewType(s.type) ? '💒 SERVIZIO (MATRIMONIO)' : '📋 WORKFLOW SERVIZIO';
  html += `<div class="section-title service">${serviceTitle}</div>`;
  html += STEPS.map(st => renderStepRow(s, st, 'service')).join('');
  
  return html;
}

function renderStepRow(s, st, section) {
  const stepsObj = section === 'preview' ? (s.previewSteps || {}) : s.steps;
  const d = stepsObj[st.id] || { done: false, date: "", extra: {} };
  const prefix = section === 'preview' ? 'p_' : 's_';
  
  let extraHtml = "";
  if (st.extra) {
    if (st.extraType === "archivedBy") {
      const currentVal = d.extra?.archivedBy || "G&LStudio";
      const isAltro = currentVal && !["G&LStudio", s.videographer].includes(currentVal);
      const displayVal = isAltro ? currentVal : "";
      extraHtml = `
        <div class="step-extra">
          <select onchange="handleArchiveByChange(${s.id}, '${st.id}', this.value, '${section}')">
            ${getArchiveByOptions(s).replace(`value="${currentVal}"`, `value="${currentVal}" selected`)}
          </select>
          ${isAltro ? `<input type="text" placeholder="Nome collega..." value="${displayVal}" onchange="updateExtra(${s.id},'${st.id}','archivedBy',this.value,'${section}')">` : ''}
        </div>`;
    } else if (st.extraType === "cover") {
      extraHtml = `
        <div class="step-extra">
          <input type="text" placeholder="Fornitore copertina" value="${d.extra?.supplier || ''}" onchange="updateExtra(${s.id},'${st.id}','supplier',this.value,'${section}')">
          <input type="text" placeholder="Articolo prodotto" value="${d.extra?.article || ''}" onchange="updateExtra(${s.id},'${st.id}','article',this.value,'${section}')">
        </div>`;
    } else if (st.extraLabel) {
      extraHtml = `
        <div class="step-extra">
          <input type="text" placeholder="${st.extraLabel}" value="${d.extra?.luogo || ''}" onchange="updateExtra(${s.id},'${st.id}','luogo',this.value,'${section}')" style="flex:2;">
        </div>`;
    }
  }
  
  return `
    <div class="step ${d.done ? 'done' : ''}">
      <input type="checkbox" ${d.done ? 'checked' : ''} onchange="toggleStep(${s.id},'${st.id}',this.checked,'${section}')">
      <div class="step-label">${st.label}</div>
      <input type="date" value="${d.date || ''}" onchange="updateDate(${s.id},'${st.id}',this.value,'${section}')">
      ${extraHtml}
    </div>`;
}

function handleArchiveByChange(serviceId, stepId, value, section) {
  const s = services.find(x => x.id === serviceId);
  if (value === "__altro__") return;
  const stepsObj = section === 'preview' ? (s.previewSteps || {}) : s.steps;
  stepsObj[stepId].extra = stepsObj[stepId].extra || {};
  stepsObj[stepId].extra.archivedBy = value;
  save();
  renderServices();
  document.getElementById("steps-" + serviceId).classList.add("open");
}

function toggleSteps(id) {
  document.getElementById("steps-" + id).classList.toggle("open");
}
function toggleStep(id, stepId, checked, section) {
  const s = services.find(x => x.id === id);
  const stepsObj = section === 'preview' ? (s.previewSteps || {}) : s.steps;
  stepsObj[stepId].done = checked;
  if (checked && !stepsObj[stepId].date) stepsObj[stepId].date = new Date().toISOString().slice(0,10);
  if (stepId === "archiveVideo" && checked && section === 'service') {
    if (!stepsObj[stepId].extra.archivedBy) stepsObj[stepId].extra.archivedBy = "G&LStudio";
  }
  if (stepId === "p_archiveVideo" && checked && section === 'preview') {
    if (!stepsObj[stepId].extra.archivedBy) stepsObj[stepId].extra.archivedBy = "G&LStudio";
  }
  save(); renderServices();
  document.getElementById("steps-" + id).classList.add("open");
  renderTable();
}
function updateDate(id, stepId, val, section) {
  const s = services.find(x => x.id === id);
  const stepsObj = section === 'preview' ? (s.previewSteps || {}) : s.steps;
  stepsObj[stepId].date = val;
  save();
}
function updateExtra(id, stepId, field, val, section) {
  const s = services.find(x => x.id === id);
  const stepsObj = section === 'preview' ? (s.previewSteps || {}) : s.steps;
  if (!stepsObj[stepId].extra) stepsObj[stepId].extra = {};
  stepsObj[stepId].extra[field] = val;
  save();
}
function deleteService(id) {
  if (!confirm("Eliminare questo servizio?")) return;
  services = services.filter(x => x.id !== id);
  save(); renderServices();
  renderTable();
}
function save() {
  localStorage.setItem("gl_services", JSON.stringify(services));
}

function viewService(id) {
  const s = services.find(x => x.id === id);
  const serviceDone = countDone(s.steps, STEPS);
  const servicePct = Math.round((serviceDone / STEPS.length) * 100);
  
  let html = `
    <div class="detail-row"><div class="detail-label">👤 Cliente</div><div class="detail-value">${s.client}</div></div>
    <div class="detail-row"><div class="detail-label"> Tipo Servizio</div><div class="detail-value">${s.type}</div></div>
    <div class="detail-row"><div class="detail-label"> Data Evento</div><div class="detail-value">${s.date || 'Non specificata'}</div></div>
    <div class="detail-row"><div class="detail-label">🎥 Videografo/Collega</div><div class="detail-value">${s.videographer || 'Non specificato'}</div></div>
  `;
  
  if (isPreviewType(s.type)) {
    const previewDone = countDone(s.previewSteps || {}, STEPS_PREVIEW);
    const previewPct = Math.round((previewDone / STEPS_PREVIEW.length) * 100);
    html += `<div class="detail-row" style="background: linear-gradient(90deg, #fff8e0, #fff0c0);"><div class="detail-label"> Avanzamento ANTEPRIMA</div><div class="detail-value">${previewDone}/${STEPS_PREVIEW.length} completati (${previewPct}%)</div></div>`;
  }
  html += `<div class="detail-row"><div class="detail-label">💒 Avanzamento SERVIZIO</div><div class="detail-value">${serviceDone}/${STEPS.length} completati (${servicePct}%)</div></div>`;
  
  // Sezione Anteprima
  if (isPreviewType(s.type)) {
    html += `<h3 style="margin:20px 0 10px; padding:10px; background: linear-gradient(45deg, #ffd700, #ffb347); color: white; border-radius: 10px;">🎬 ANTEPRIMA</h3>`;
    STEPS_PREVIEW.forEach(st => {
      const d = (s.previewSteps || {})[st.id] || { done: false, date: "", extra: {} };
      html += renderStepDetail(st, d);
    });
  }
  
  // Sezione Servizio
  html += `<h3 style="margin:20px 0 10px; padding:10px; background: linear-gradient(45deg, #667eea, #764ba2); color: white; border-radius: 10px;">💒 SERVIZIO</h3>`;
  STEPS.forEach(st => {
    const d = s.steps[st.id] || { done: false, date: "", extra: {} };
    html += renderStepDetail(st, d);
  });
  
  document.getElementById("detailTitle").textContent = `📋 ${s.client} - ${s.type}`;
  document.getElementById("detailBody").innerHTML = html;
  document.getElementById("detailModal").classList.add("active");
}

function renderStepDetail(st, d) {
  const status = d.done ? '✅' : '';
  const dateStr = d.date ? ` - ${d.date}` : '';
  const extraInfo = [];
  if (st.extraType === "archivedBy" && d.extra?.archivedBy) extraInfo.push(`Archiviato da: ${d.extra.archivedBy}`);
  if (st.extraType === "cover") {
    if (d.extra?.supplier) extraInfo.push(`Fornitore: ${d.extra.supplier}`);
    if (d.extra?.article) extraInfo.push(`Articolo: ${d.extra.article}`);
  }
  if (st.extraLabel && d.extra?.luogo) extraInfo.push(`Luogo: ${d.extra.luogo}`);
  return `<div class="step-detail ${d.done ? 'completed' : ''}">
    <div class="step-name">${status} ${st.label}${dateStr}</div>
    ${extraInfo.length ? `<div class="step-extra-info">${extraInfo.join(' | ')}</div>` : ''}
  </div>`;
}

function editService(id) {
  const s = services.find(x => x.id === id);
  editingId = id;
  document.getElementById("editClient").value = s.client;
  document.getElementById("editType").value = s.type;
  document.getElementById("editDate").value = s.date || '';
  document.getElementById("editVideographer").value = s.videographer || '';
  document.getElementById("editModal").classList.add("active");
}
function saveEdit() {
  if (!editingId) return;
  const s = services.find(x => x.id === editingId);
  const oldType = s.type;
  s.client = document.getElementById("editClient").value.trim();
  s.type = document.getElementById("editType").value;
  s.date = document.getElementById("editDate").value;
  s.videographer = document.getElementById("editVideographer").value.trim();
  
  // Se cambia tipo in "Anteprima + Matrimonio", aggiungi previewSteps
  if (isPreviewType(s.type) && !s.previewSteps) {
    s.previewSteps = {};
    STEPS_PREVIEW.forEach(st => s.previewSteps[st.id] = { done: false, date: "", extra: {} });
  }
  // Se cambia tipo da "Anteprima + Matrimonio" ad altro, rimuovi previewSteps
  if (!isPreviewType(s.type) && oldType === "Anteprima + Matrimonio") {
    delete s.previewSteps;
  }
  
  save();
  closeModal('editModal');
  renderServices();
  renderTable();
}

async function generatePDF(id) {
  const s = services.find(x => x.id === id);
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();
  doc.setFillColor(102, 126, 234);
  doc.rect(0, 0, 210, 40, 'F');
  doc.setTextColor(255, 255, 255);
  doc.setFontSize(24);
  doc.text("G&LStudio", 15, 20);
  doc.setFontSize(12);
  doc.text("Workflow Foto & Video", 15, 28);
  doc.setTextColor(0, 0, 0);
  doc.setFontSize(14);
  doc.text(`Cliente: ${s.client}`, 15, 55);
  doc.text(`Tipo: ${s.type}`, 15, 63);
  doc.text(`Data Evento: ${s.date || 'N/D'}`, 15, 71);
  doc.text(`Videografo: ${s.videographer || 'N/D'}`, 15, 79);
  
  let y = 92;
  
  // Sezione Anteprima
  if (isPreviewType(s.type)) {
    doc.setFillColor(255, 215, 0);
    doc.rect(15, y - 5, 180, 8, 'F');
    doc.setTextColor(0, 0, 0);
    doc.setFontSize(12);
    doc.text("🎬 ANTEPRIMA", 20, y);
    y += 8;
    STEPS_PREVIEW.forEach(st => {
      const d = (s.previewSteps || {})[st.id] || { done: false, date: "", extra: {} };
      const status = d.done ? "[X]" : "[ ]";
      const dateStr = d.date ? ` - ${d.date}` : '';
      doc.text(`${status} ${st.label}${dateStr}`, 20, y);
      y += 7;
      const extra = getExtraText(st, d);
      if (extra) {
        doc.setTextColor(100, 100, 100);
        doc.text(`    → ${extra}`, 20, y);
        doc.setTextColor(0, 0, 0);
        y += 7;
      }
      if (y > 270) { doc.addPage(); y = 20; }
    });
    y += 5;
  }
  
  // Sezione Servizio
  doc.setFillColor(102, 126, 234);
  doc.rect(15, y - 5, 180, 8, 'F');
  doc.setTextColor(255, 255, 255);
  doc.setFontSize(12);
  doc.text("💒 SERVIZIO", 20, y);
  doc.setTextColor(0, 0, 0);
  y += 8;
  STEPS.forEach(st => {
    const d = s.steps[st.id] || { done: false, date: "", extra: {} };
    const status = d.done ? "[X]" : "[ ]";
    const dateStr = d.date ? ` - ${d.date}` : '';
    doc.text(`${status} ${st.label}${dateStr}`, 20, y);
    y += 7;
    const extra = getExtraText(st, d);
    if (extra) {
      doc.setTextColor(100, 100, 100);
      doc.text(`    → ${extra}`, 20, y);
      doc.setTextColor(0, 0, 0);
      y += 7;
    }
    if (y > 270) { doc.addPage(); y = 20; }
  });
  
  doc.setFontSize(10);
  doc.setTextColor(150, 150, 150);
  doc.text(`Generato il ${new Date().toLocaleDateString('it-IT')}`, 15, 285);
  doc.save(`G&LStudio_${s.client.replace(/\s+/g, '_')}_${s.type.replace(/\s+/g, '_')}.pdf`);
}

function getExtraText(st, d) {
  const extra = [];
  if (st.extraType === "archivedBy" && d.extra?.archivedBy) extra.push(`Archiviato da: ${d.extra.archivedBy}`);
  if (st.extraType === "cover") {
    if (d.extra?.supplier) extra.push(`Fornitore: ${d.extra.supplier}`);
    if (d.extra?.article) extra.push(`Articolo: ${d.extra.article}`);
  }
  if (st.extraLabel && d.extra?.luogo) extra.push(`Luogo: ${d.extra.luogo}`);
  return extra.join(' | ');
}

function showArchive() {
  document.getElementById("servicesList").style.display = "none";
  document.getElementById("tableView").style.display = "none";
  document.getElementById("newService").classList.remove("open");
  document.getElementById("archiveView").style.display = "block";
  filterServices();
}
function showTable() {
  document.getElementById("servicesList").style.display = "none";
  document.getElementById("archiveView").style.display = "none";
  document.getElementById("newService").classList.remove("open");
  document.getElementById("tableView").style.display = "block";
  renderTable();
}
function showMain() {
  document.getElementById("archiveView").style.display = "none";
  document.getElementById("tableView").style.display = "none";
  document.getElementById("servicesList").style.display = "block";
  renderServices();
}
function filterServices() {
  const search = document.getElementById("searchBox").value.toLowerCase();
  const type = document.getElementById("filterType").value;
  let filtered = services;
  if (search) filtered = filtered.filter(s => s.client.toLowerCase().includes(search) || (s.videographer || '').toLowerCase().includes(search));
  if (type) filtered = filtered.filter(s => s.type === type);
  const list = document.getElementById("archiveList");
  if (filtered.length === 0) {
    list.innerHTML = '<div class="empty">Nessun servizio trovato</div>';
    return;
  }
  list.innerHTML = filtered.map(s => {
    const serviceDone = countDone(s.steps, STEPS);
    const servicePct = Math.round((serviceDone / STEPS.length) * 100);
    const color = TYPE_COLORS[s.type] || TYPE_COLORS["Evento"];
    const videoInfo = s.videographer ? `<div class="videographer-info">🎥 Videografo: ${s.videographer}</div>` : '';
    
    let progressHtml = '';
    if (isPreviewType(s.type)) {
      const previewDone = countDone(s.previewSteps || {}, STEPS_PREVIEW);
      const previewPct = Math.round((previewDone / STEPS_PREVIEW.length) * 100);
      progressHtml = `
        <div class="progress-row">
          <div>
            <div class="progress-label">🎬 ANTEPRIMA</div>
            <div class="progress-bar"><div class="progress-fill" style="width:${previewPct}%; background: linear-gradient(90deg, #ffd700, #ffb347);"></div></div>
            <div class="progress-text">${previewDone}/${STEPS_PREVIEW.length} (${previewPct}%)</div>
          </div>
          <div>
            <div class="progress-label">💒 SERVIZIO</div>
            <div class="progress-bar"><div class="progress-fill" style="width:${servicePct}%"></div></div>
            <div class="progress-text">${serviceDone}/${STEPS.length} (${servicePct}%)</div>
          </div>
        </div>`;
    } else {
      progressHtml = `<div class="progress-bar"><div class="progress-fill" style="width:${servicePct}%"></div></div>
        <div class="progress-text">Completamento: ${servicePct}%</div>`;
    }
    
    return `
      <div class="card">
        <div class="card-header">
          <div class="client-info">
            <div class="client-name">${s.client}</div>
            <div class="client-date">${s.date ? ' ' + s.date : ''}</div>
            ${videoInfo}
          </div>
          <div class="service-badge" style="background:${color}">${s.type}</div>
        </div>
        ${progressHtml}
        <div class="card-footer">
          <button class="btn-view" onclick="viewService(${s.id})">👁️ Visualizza</button>
          <button class="btn-edit" onclick="editService(${s.id})">️ Modifica</button>
          <button class="btn-pdf" onclick="generatePDF(${s.id})">📄 PDF</button>
        </div>
      </div>`;
  }).join("");
}

function renderTable() {
  const search = (document.getElementById("tableSearch")?.value || "").toLowerCase();
  let filtered = services;
  if (search) {
    filtered = filtered.filter(s => s.client.toLowerCase().includes(search) || s.type.toLowerCase().includes(search) || (s.videographer || '').toLowerCase().includes(search));
  }
  const table = document.getElementById("workflowTable");
  if (filtered.length === 0) {
    table.innerHTML = '<tr><td colspan="100%" style="padding:40px;text-align:center;color:#888;">Nessun servizio trovato</td></tr>';
    return;
  }
  let thead = '<thead><tr>';
  thead += '<th>Cliente</th><th>Tipo</th><th>Data</th><th>Videografo</th>';
  if (filtered.some(s => isPreviewType(s.type))) {
    thead += '<th style="background: linear-gradient(45deg, #ffd700, #ffb347);">🎬 Anteprima</th>';
  }
  thead += '<th>💒 Servizio</th>';
  thead += '<th>Azioni</th></tr></thead>';
  
  let tbody = '<tbody>';
  filtered.forEach(s => {
    const color = TYPE_COLORS[s.type] || TYPE_COLORS["Evento"];
    const serviceDone = countDone(s.steps, STEPS);
    const servicePct = Math.round((serviceDone / STEPS.length) * 100);
    tbody += '<tr>';
    tbody += `<td>${s.client}</td>`;
    tbody += `<td><span class="badge-cell" style="background:${color}">${s.type}</span></td>`;
    tbody += `<td>${s.date || '-'}</td>`;
    tbody += `<td>${s.videographer || '-'}</td>`;
    
    if (isPreviewType(s.type)) {
      const previewDone = countDone(s.previewSteps || {}, STEPS_PREVIEW);
      const previewPct = Math.round((previewDone / STEPS_PREVIEW.length) * 100);
      tbody += `<td><span class="summary-badge" style="background: linear-gradient(45deg, #ffd700, #ffb347);">${previewDone}/${STEPS_PREVIEW.length} (${previewPct}%)</span></td>`;
    }
    
    tbody += `<td><span class="summary-badge" style="background: linear-gradient(45deg, #667eea, #764ba2);">${serviceDone}/${STEPS.length} (${servicePct}%)</span></td>`;
    tbody += `<td>
      <div class="cell-actions">
        <button class="mini-view" onclick="viewService(${s.id})" title="Visualizza">👁️</button>
        <button class="mini-edit" onclick="editService(${s.id})" title="Modifica">️</button>
        <button class="mini-pdf" onclick="generatePDF(${s.id})" title="PDF">📄</button>
        <button class="mini-del" onclick="deleteService(${s.id})" title="Elimina">🗑️</button>
      </div>
    </td>`;
    tbody += '</tr>';
  });
  tbody += '</tbody>';
  table.innerHTML = thead + tbody;
}

function generateTablePDF() {
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ orientation: 'landscape', unit: 'mm', format: 'a4' });
  doc.setFillColor(102, 126, 234);
  doc.rect(0, 0, 297, 25, 'F');
  doc.setTextColor(255, 255, 255);
  doc.setFontSize(20);
  doc.text("G&LStudio - Tabella Workflow Clienti", 14, 16);
  
  const hasPreview = services.some(s => isPreviewType(s.type));
  const head = [['Cliente', 'Tipo', 'Data', 'Videografo']];
  if (hasPreview) head[0].push('🎬 Anteprima');
  head[0].push('💒 Servizio');
  
  const body = services.map(s => {
    const serviceDone = countDone(s.steps, STEPS);
    const servicePct = Math.round((serviceDone / STEPS.length) * 100);
    const row = [s.client, s.type, s.date || '-', s.videographer || '-'];
    if (isPreviewType(s.type)) {
      const previewDone = countDone(s.previewSteps || {}, STEPS_PREVIEW);
      const previewPct = Math.round((previewDone / STEPS_PREVIEW.length) * 100);
      row.push(`${previewDone}/${STEPS_PREVIEW.length} (${previewPct}%)`);
    }
    row.push(`${serviceDone}/${STEPS.length} (${servicePct}%)`);
    return row;
  });
  
  doc.autoTable({
    startY: 30,
    head: head,
    body: body,
    theme: 'grid',
    headStyles: { fillColor: [102, 126, 234], textColor: 255, fontSize: 8, halign: 'center' },
    bodyStyles: { fontSize: 8, cellPadding: 3 },
    columnStyles: {
      0: { cellWidth: 40 },
      1: { cellWidth: 35, halign: 'center' },
      2: { cellWidth: 25, halign: 'center' },
      3: { cellWidth: 30 },
    },
    alternateRowStyles: { fillColor: [240, 245, 255] }
  });
  
  const pageCount = doc.internal.getNumberOfPages();
  for (let i = 1; i <= pageCount; i++) {
    doc.setPage(i);
    doc.setFontSize(9);
    doc.setTextColor(150, 150, 150);
    doc.text(`Pagina ${i} di ${pageCount} - Generato il ${new Date().toLocaleDateString('it-IT')}`, 14, doc.internal.pageSize.height - 10);
  }
  doc.save(`G&LStudio_Tabella_Clienti_${new Date().toISOString().slice(0,10)}.pdf`);
}

function doBackup() {
  const data = { version: 5, exportedAt: new Date().toISOString(), services };
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "GLStudio_Backup_" + new Date().toISOString().slice(0,10) + ".json";
  a.click();
}
function doRestore(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    try {
      const data = JSON.parse(ev.target.result);
      if (!data.services || !Array.isArray(data.services)) throw new Error();
      if (!confirm("Il ripristino sovrascriverà i dati attuali. Continuare?")) return;
      services = data.services.map(migrateService);
      save(); renderServices(); renderTable();
      alert("✅ Ripristino completato!");
    } catch { alert("❌ File di backup non valido"); }
  };
  reader.readAsText(file);
  e.target.value = "";
}

function closeModal(id) {
  document.getElementById(id).classList.remove("active");
  editingId = null;
}
document.getElementById("loginPass").addEventListener("keypress", e => { if (e.key === "Enter") doLogin(); });
</script>
